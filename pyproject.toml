[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edith-brain-core"
version = "0.1.0"
description = "E.D.I.T.H. Brain Core - Independent, reusable knowledge and memory foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "E.D.I.T.H. Architect" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=6.0.0",
    "python-docx>=1.0.0",
    "python-multipart>=0.0.9",
    "numpy>=2.0.0",
    "fastembed>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
